<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyodide Jupyter Notebook</title>

<link rel="stylesheet" href="styles.css">
<script defer src="codemirror.bundle.js"></script>
<script defer src="app.js"></script>
</head>
<body>
  <header class="nb-header">
    <div class="header-left">
      <div class="logo" title="Project Jupyter">
        <svg viewBox="0 0 44 51" class="logo-icon" aria-hidden="true">
          <path fill="#767677" d="M39.5,3.5c0,0.6-0.1,1.2-0.4,1.7c-0.3,0.5-0.8,0.9-1.3,1.2c-0.5,0.3-1.1,0.4-1.7,0.3c-0.6-0.1-1.1-0.3-1.6-0.7C34,5.6,33.7,5,33.6,4.4c-0.1-0.6-0.1-1.2,0.1-1.8s0.6-1.1,1.1-1.4c0.5-0.4,1.1-0.6,1.7-0.6c0.4,0,0.8,0,1.2,0.2c0.4,0.1,0.7,0.3,1,0.6c0.3,0.3,0.5,0.6,0.7,0.9S39.5,3.1,39.5,3.5L39.5,3.5z"/>
          <path fill="#F37726" d="M21.9,38.4c-8,0-15.1-2.9-18.7-7.1c1.4,3.8,4,7.1,7.3,9.4c3.3,2.3,7.3,3.6,11.4,3.6c4.1,0,8-1.2,11.4-3.6c3.3-2.3,5.9-5.6,7.3-9.4C37,35.5,30,38.4,21.9,38.4z"/>
          <path fill="#F37726" d="M21.9,10.8c8,0,15.1,2.9,18.7,7.1c-1.4-3.8-4-7.1-7.3-9.4C30,6.1,26,4.9,21.9,4.9c-4.1,0-8,1.2-11.4,3.6c-3.3,2.3-5.9,5.6-7.3,9.4C6.9,13.6,13.9,10.8,21.9,10.8z"/>
          <path fill="#9E9E9E" d="M10.9,46.7c0,0.8-0.1,1.5-0.5,2.2C10,49.5,9.4,50,8.7,50.3c-0.7,0.3-1.4,0.4-2.2,0.3c-0.7-0.1-1.4-0.4-2-0.9c-0.6-0.5-1-1.2-1.1-1.9c-0.2-0.7-0.1-1.5,0.1-2.2c0.3-0.7,0.7-1.3,1.3-1.8c0.6-0.4,1.3-0.7,2.1-0.7c0.5,0,1,0,1.5,0.2c0.5,0.2,0.9,0.4,1.3,0.8s0.7,0.7,0.9,1.2C10.7,45.7,10.8,46.2,10.9,46.7L10.9,46.7z"/>
          <path fill="#616262" d="M4.1,9.8c-0.4,0-0.9-0.1-1.2-0.3c-0.4-0.2-0.7-0.6-0.8-1C1.9,8.1,1.8,7.7,1.9,7.3s0.3-0.8,0.6-1.1c0.3-0.3,0.7-0.5,1.1-0.6C4,5.4,4.4,5.4,4.8,5.6c0.4,0.2,0.8,0.4,1,0.8c0.3,0.3,0.4,0.8,0.4,1.2c0,0.6-0.2,1.2-0.6,1.6C5.3,9.5,4.7,9.8,4.1,9.8z"/>
        </svg>
      </div>
      <div class="title-wrap">
        <input type="text" id="nb-title" class="title-input" value="Untitled.ipynb" spellcheck="false" title="Click to rename notebook">
      </div>
    </div>

    <div class="toolbar">
      <!-- New Notebook -->
      <button class="btn icon" id="btn-new" title="New Notebook (Blank Slate)">
        <svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm4 18H6V4h7v5h5z"/></svg>
      </button>

      <!-- Save / Export -->
      <button class="btn icon" id="btn-export" title="Save and Export (.ipynb)">
        <svg class="i" viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3m3-10H5V5h10z"/></svg>
      </button>

      <!-- Insert cell below -->
      <button class="btn icon" id="btn-add-code" title="Insert cell below (B)">
        <svg class="i" viewBox="0 0 16 16"><path d="m13 8.8h-4v4h-1.6v-4h-4v-1.6h4v-4h1.6v4h4z"/></svg>
      </button>

      <div class="sep-v"></div>

      <!-- Run cell -->
      <button class="btn icon primary-run" id="btn-run" title="Run cell and advance (Shift+Enter)">
        <svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Restart kernel -->
      <button class="btn icon" id="btn-restart" title="Restart Python kernel">
        <svg class="i" viewBox="0 0 18 18"><path d="M9 13.5c-2.49 0-4.5-2.01-4.5-4.5S6.51 4.5 9 4.5c1.24 0 2.36.52 3.17 1.33L10 8h5V3l-1.76 1.76A6 6 0 0 0 9 3C5.69 3 3.01 5.69 3.01 9S5.69 15 9 15a5.98 5.98 0 0 0 5.9-5h-1.52c-.46 2-2.24 3.5-4.38 3.5"/></svg>
      </button>

      <!-- Fast-Forward / Run all -->
      <button class="btn icon" id="btn-run-all" title="Restart & Run all cells">
        <svg class="i" viewBox="0 0 24 24"><path d="m4 18 8.5-6L4 6zm9-12v12l8.5-6z"/></svg>
      </button>

      <div class="sep-v"></div>

      <!-- Cell type selector (JupyterLab style toolbar dropdown) -->
      <div class="select-wrap">
        <select class="jp-toolbar-select" id="toolbar-cell-type" title="Change cell type">
          <option value="code">Code</option>
          <option value="markdown">Markdown</option>
        </select>
      </div>

      <div class="sep-v"></div>

      <!-- Open .ipynb -->
      <button class="btn icon" id="btn-open" title="Open .ipynb notebook file">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
      </button>

      <!-- Clear outputs -->
      <button class="btn icon" id="btn-clear-all" title="Clear all outputs">
        <svg class="i" viewBox="0 0 24 24"><path d="M4.929 6.343 6.343 4.93l12.728 12.728-1.414 1.414z"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>

      <!-- Install Packages -->
      <button class="btn icon" id="install-open" title="Install Python packages" aria-label="Install packages">
        <svg class="i" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7zM5 18v2h14v-2z"/></svg>
      </button>

      <!-- Install popover -->
      <div class="popover" id="install-pop" hidden>
        <div class="pop-title">Install Python Packages</div>
        <div class="pop-row">
          <input type="text" id="pip-pkg" spellcheck="false" placeholder="numpy, pandas, scipy, sympy" autocomplete="off">
          <button class="btn primary" id="pip-install">Install</button>
        </div>
        <div class="pop-foot">
          <label class="switch">
            <input type="checkbox" id="autoinstall" checked>
            auto-install missing imports
          </label>
        </div>
        <div class="pop-hint">
          Packages are compiled for WebAssembly and run client-side via Pyodide/micropip.
        </div>
      </div>
    </div>
  </header>

  <input type="file" id="nb-file-input" accept=".ipynb,application/json" hidden>

  <main class="nb-main" id="notebook-main">
    <div class="nb-canvas" id="notebook">
      <!-- Cells rendered dynamically -->
    </div>
    <div class="nb-bottom-adder">
      <button class="btn round-btn" id="bottom-add-code">+ Code</button>
      <button class="btn round-btn" id="bottom-add-md">+ Markdown</button>
    </div>
  </main>

  <footer class="nb-footer">
    <span id="foot-status">Pyodide Ready</span>
    <span class="sep">·</span>
    <span id="foot-python">Python 3.13.2</span>
    <span class="sep">·</span>
    <span id="foot-cell-count">0 cells</span>
    <span class="flex1"></span>
    <span class="shortcuts-hint">
      <kbd>Shift</kbd>+<kbd>Enter</kbd> run & advance · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> run in place · <kbd>Esc</kbd> command mode
    </span>
  </footer>
</body>
</html>
