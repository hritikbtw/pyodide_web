<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyodide Jupyter Notebook</title>

<link rel="stylesheet" href="styles.css">
<script defer src="codemirror.bundle.js"></script>
<script defer src="app.js"></script>
</head>
<body>
  <header class="nb-header">
    <div class="header-left">
      <div class="logo" title="Pyodide Notebook">
        <svg viewBox="0 0 24 24" class="logo-icon" aria-hidden="true">
          <circle cx="12" cy="12" r="3" fill="#da5b0b"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.5" fill="none" stroke="#da5b0b" stroke-width="1.6" transform="rotate(-30 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.5" fill="none" stroke="#767676" stroke-width="1.4" transform="rotate(30 12 12)"/>
        </svg>
      </div>
      <div class="title-wrap">
        <input type="text" id="nb-title" class="title-input" value="playground.ipynb" spellcheck="false" title="Click to rename notebook">
      </div>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button class="btn" id="btn-add-code" title="Insert code cell below (B)">
          <svg class="i" viewBox="0 0 16 16"><path d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
          Code
        </button>
        <button class="btn" id="btn-add-md" title="Insert markdown cell below (M)">
          <svg class="i" viewBox="0 0 16 16"><path d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
          Markdown
        </button>
      </div>

      <div class="sep-v"></div>

      <div class="btn-group">
        <button class="btn primary" id="btn-run" title="Run cell and advance (Shift+Enter)">
          <svg class="i" viewBox="0 0 16 16"><path d="M3.78 2L3 2.41v12l.78.42 9-6V8l-9-6zM4 13.48V3.35l7.6 5.07L4 13.48z"/></svg>
          Run
        </button>
        <button class="btn" id="btn-run-all" title="Run all cells in notebook">
          <svg class="i" viewBox="0 0 16 16"><path d="M2.78 2L2 2.41v12l.78.42 6-4V10l-6-4zm7 0L9 2.41v12l.78.42 6-4V10l-6-4z"/></svg>
          Run All
        </button>
        <button class="btn icon" id="btn-restart" title="Restart Python kernel" aria-label="Restart Python kernel">
          <svg class="i" viewBox="0 0 16 16"><path d="M12.75 8a4.5 4.5 0 01-8.61 1.834l-1.391.565A6.001 6.001 0 0014.25 8 6 6 0 003.5 4.334V2.5H2v4l.75.75h3.5v-1.5H4.352A4.5 4.5 0 0112.75 8z"/></svg>
        </button>
        <button class="btn icon" id="btn-clear-all" title="Clear all outputs" aria-label="Clear all outputs">
          <svg class="i" viewBox="0 0 16 16"><path d="M8 8.707l3.646 3.647.708-.707L8.707 8l3.647-3.646-.707-.708L8 7.293 4.354 3.646l-.707.708L7.293 8l-3.646 3.646.707.708L8 8.707z"/></svg>
        </button>
      </div>

      <div class="sep-v"></div>

      <div class="btn-group">
        <button class="btn" id="btn-open" title="Open .ipynb notebook file">
          <svg class="i" viewBox="0 0 16 16"><path d="M1.75 2.5h4.5l1.5 1.5h6.5c.414 0 .75.336.75.75v8.5a.75.75 0 01-.75.75H1.75a.75.75 0 01-.75-.75v-10a.75.75 0 01.75-.75zm0 2.25v7.75h12.5V4.75H7.439l-1.5-1.5H1.75v-.75z"/></svg>
          Open
        </button>
        <button class="btn" id="btn-export" title="Export as Jupyter Notebook (.ipynb)">
          <svg class="i" viewBox="0 0 16 16"><path d="M8 12l-4-4h2.5V2h3v6H12L8 12zm-6 2h12v1.5H2V14z"/></svg>
          Export
        </button>
      </div>

      <div class="sep-v"></div>

      <div class="btn-group">
        <button class="btn icon" id="install-open" title="Install Python packages" aria-label="Install packages">
          <svg class="i" viewBox="0 0 16 16"><path d="M11.957 6h.05a2.99 2.99 0 012.116.879 3.003 3.003 0 010 4.242 2.99 2.99 0 01-2.117.879v-1a2.002 2.002 0 000-4h-.914l-.123-.857a2.49 2.49 0 00-2.126-2.122A2.478 2.478 0 006.231 5.5l-.333.762-.809-.189A2.49 2.49 0 004.523 6c-.662 0-1.297.263-1.764.732A2.503 2.503 0 004.523 11h.498v1h-.498a3.486 3.486 0 01-2.628-1.16 3.502 3.502 0 011.958-5.78 3.462 3.462 0 011.468.04 3.486 3.486 0 013.657-2.06A3.479 3.479 0 0111.957 6zm-5.25 5.121l1.314 1.314V7h.994v5.4l1.278-1.279.707.707-2.146 2.147h-.708L6 11.829l.707-.708z"/></svg>
        </button>
      </div>

      <div class="popover" id="install-pop" hidden>
        <div class="pop-title">Install Python Packages</div>
        <div class="pop-row">
          <input type="text" id="pip-pkg" spellcheck="false" placeholder="numpy, pandas, scipy, sympy" autocomplete="off">
          <button class="btn primary" id="pip-install">Install</button>
        </div>
        <div class="pop-foot">
          <label class="switch">
            <input type="checkbox" id="autoinstall" checked>
            auto-install missing imports
          </label>
        </div>
        <div class="pop-hint">
          Wheels are downloaded from Pyodide CDN or PyPI (via micropip). They run client-side in WebAssembly.
        </div>
      </div>
    </div>
  </header>

  <input type="file" id="nb-file-input" accept=".ipynb,application/json" hidden>

  <main class="nb-main" id="notebook-main">
    <div class="nb-canvas" id="notebook">
      <!-- Cells will be dynamically rendered here -->
    </div>
    <div class="nb-bottom-adder">
      <button class="btn round-btn" id="bottom-add-code">+ Code</button>
      <button class="btn round-btn" id="bottom-add-md">+ Markdown</button>
    </div>
  </main>

  <footer class="nb-footer">
    <span id="foot-status">Pyodide: Ready</span>
    <span class="sep">·</span>
    <span id="foot-python">Python 3.13.2</span>
    <span class="sep">·</span>
    <span id="foot-cell-count">0 cells</span>
    <span class="flex1"></span>
    <span class="shortcuts-hint">
      <kbd>Shift</kbd>+<kbd>Enter</kbd> run & advance · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> run in place · <kbd>Esc</kbd> command mode
    </span>
  </footer>
</body>
</html>
